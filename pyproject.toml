[project]
name = "grid-authority-workers"
version = "0.1.0"
description = "EIA ingest workers for Grid Authority"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.10.4",
    "pyyaml>=6.0.2",
    "typer>=0.15.1",
]

[project.scripts]
eia = "workers.eia.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "respx>=0.22.0",
    "ruff>=0.8.4",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workers"]

[tool.pytest.ini_options]
testpaths = ["workers"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Planning/ is gitignored working material, not project source.
extend-exclude = ["Planning"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
exclude = ["^Planning/"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
