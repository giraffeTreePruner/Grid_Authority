# Data source registry. Drives /api/v1/sources and the About Data page.
#
# Inactive entries are registered here before they are used so that their display
# label is fixed from the start and cannot drift between stages.

- id: eia
  label: EIA Form 930
  attribution: U.S. Energy Information Administration, Hourly Electric Grid Monitor
  url: https://www.eia.gov/electricity/gridmonitor/
  license: Public domain (U.S. Government work)
  independent: true
  notes: Publicly available data from the US Government. It updates hourly and is the backbone of this project.
         It's provisional and revised for several days after publication.
  active: true

# Reserved, inactive in MVP 1. Any series computed with this methodology must display
# the label below verbatim wherever it appears: chart legends, tooltips, comparison
# tables and API meta.sources.
- id: emaps_method
  label: Electricity Maps methodology (My implementation)
  attribution: Methodology and emission factors from electricitymaps-contrib (AGPL-3.0)
  url: https://github.com/electricitymaps/electricitymaps-contrib
  license: AGPL-3.0 (methodology and configuration reused; data computed by this project)
  independent: false
  notes: >
    Not Electricity Maps data in compliance with their licensing terms. This project applies their published methodology and
    emission factors to EIA data. The computed figures is mine, not theirs, and this project is
    not affiliated with or endorsed by Electricity Maps, though, much kudos and appreciation!
  active: false

# Zone geometry. Registered because §11 requires recording which source the committed
# zones.pmtiles was built from, and because the AGPL requires attribution.
- id: emaps_geo
  label: Electricity Maps zone geometry
  attribution: Zone boundaries from electricitymaps-contrib (AGPL-3.0)
  url: https://github.com/electricitymaps/electricitymaps-contrib
  license: AGPL-3.0
  independent: false
  notes: >
    Balancing authority boundaries used to draw the map, taken from
    electricitymaps-contrib and reused under AGPL 3, which this project also uses.
    Geometry only: no measurements come from this source. The SPP West boundary is
    derived here as the union of the two Western Area Power Administration areas it
    absorbed, but it wasn't present originally.
  active: true
