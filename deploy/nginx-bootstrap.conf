# Bootstrap site, used once to obtain the first certificate.
#
# The real config in nginx.conf cannot be enabled yet: its TLS block points at
# certificate files certbot has not created, so `nginx -t` fails. This serves the ACME
# challenge over plain HTTP and nothing else, which is all certbot needs.
#
# Replace grid.example.org, enable it, obtain the certificate, then swap in nginx.conf.
# After the swap this file is not used again: nginx.conf keeps the same challenge
# location, so renewals continue to work with nginx running.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name grid.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nothing else is served yet. 503 rather than 404: the site is coming, not missing.
    location / {
        return 503 "Grid Authority is not configured yet.\n";
        add_header Content-Type text/plain always;
    }
}
