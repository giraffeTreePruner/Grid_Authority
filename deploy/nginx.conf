# nginx for Grid Authority.
#
# Place at /etc/nginx/sites-available/grid-authority and symlink into sites-enabled.
# Replace grid.example.org with the real host before enabling.
#
# This cannot be enabled until a certificate exists: the TLS block below points at
# files certbot creates. Use deploy/nginx-bootstrap.conf to obtain the first one, then
# swap this in. See the runbook at 2.10.

# Client addresses.
#
# Without a proxy in front, nginx sees the real client address on the socket and the
# rate limits below key on it correctly. Nothing more is needed.
#
# When Cloudflare goes in front, the socket address becomes Cloudflare's, and every
# visitor would collapse into a single rate-limit bucket. Install the snippet and
# uncomment the include below at that point, not before: trusting a forwarded header
# from anything other than a known proxy lets a client claim any address it likes.
#
#   sudo cp deploy/cloudflare-realip.conf /etc/nginx/snippets/
#
# include /etc/nginx/snippets/cloudflare-realip.conf;


limit_req_zone $binary_remote_addr zone=api:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=site:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# A short microcache in front of the API. The data changes twice an hour at most, so
# sixty seconds absorbs a crowd without ever serving anything meaningfully stale.
proxy_cache_path /var/cache/nginx/grid levels=1:2 keys_zone=apicache:10m
                 max_size=256m inactive=10m use_temp_path=off;

upstream grid_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name grid.example.org;

    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grid.example.org;

    ssl_certificate     /etc/letsencrypt/live/grid.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grid.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /srv/grid-authority/packages/web/dist;
    index index.html;

    client_max_body_size 1m;
    limit_conn perip 10;

    # Compression. brotli requires ngx_brotli; the gzip block stands alone if it is
    # not built in, so this config works on a stock nginx too.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/x-protobuf;

    # brotli on;
    # brotli_comp_level 5;
    # brotli_types application/json application/javascript text/css text/plain
    #              image/svg+xml application/x-protobuf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- API ------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://grid_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_cache apicache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        # One request refreshes a cold entry; the rest are served the previous copy
        # rather than all stampeding the API at once.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        # /health must never be cached: a cached 200 would hide an outage.
        location = /api/v1/health {
            proxy_pass http://grid_api;
            proxy_cache off;
            add_header Cache-Control "no-store" always;
        }
    }

    # --- Static -----------------------------------------------------------------------
    location / {
        limit_req zone=site burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Vite writes content-hashed filenames, so these can never go stale.
    #
    # `expires` and `add_header Cache-Control` both emit the header, and two of them
    # means the browser takes the first and drops `immutable`. One directive only.
    location /assets/ {
        limit_req zone=site burst=40 nodelay;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The geometry archive is versioned by query string and is equally immutable.
    location = /zones.pmtiles {
        limit_req zone=site burst=40 nodelay;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # index.html must always be revalidated, or a deploy never reaches anyone.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
    }

    access_log /var/log/nginx/grid-access.log;
    error_log  /var/log/nginx/grid-error.log warn;
}
