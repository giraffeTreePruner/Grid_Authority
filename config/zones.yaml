# Zone registry: the single source of truth for what exists.
#
# Every EIA-930 respondent appears here or in excluded_respondents.yaml.
#
# Derived from the EIA facet and data endpoints, not from assumption:
#   - Region membership was solved by reconciliation. Each regional aggregate's
#     demand, net generation and total interchange equals the sum of its member
#     balancing authorities across 1,050 region-hours with no mismatch.
#   - Every capability flag records what the respondent was actually observed to
#     publish. Several balancing authorities report generation but no demand, and
#     marking those demand: true would leave the map permanently showing "no data"
#     for a series that is never coming.
#
# interconnection, timezone and short_name are the fields the API does not expose
# and are maintained by hand. timezone is display only; all storage is UTC.
#
# Aggregates carry in_map: false. They exist for national charts and must never be
# drawn on the map, where they would double-count the zones they contain.

# --- National total ---------------------------------------------------------

- key: US-US48
  eia_respondent: US48
  name: United States Lower 48
  short_name: US Lower 48
  interconnection: null
  timezone: UTC
  type: country_total
  parent: null
  in_map: false
  capabilities:
    demand: true
    demand_forecast: true
    net_generation: true
    fuel_mix: true
    interchange: true

